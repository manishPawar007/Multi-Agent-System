<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniAgent AI | Zero-Cost Local Multi-Agent AI Platform</title>

  <!-- Tailwind CSS Engine CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            background: "#090d16",
            card: "#111827",
            cardLight: "#1f293d",
            border: "#2a374e",
            primary: {
              50: "#eef2ff",
              100: "#e0e7ff",
              300: "#a5b4fc",
              400: "#818cf8",
              500: "#6366f1",
              600: "#4f46e5",
              700: "#4338ca",
              900: "#1e1b4b",
              950: "#0f172a",
            },
            accent: {
              cyan: "#06b6d4",
              emerald: "#10b981",
              purple: "#a855f7",
              amber: "#f59e0b",
              rose: "#f43f5e",
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-background text-gray-100 h-screen overflow-hidden flex flex-col antialiased">

  <!-- Top App Navigation Bar -->
  <header id="app-header" class="h-16 shrink-0 border-b border-border bg-card/60 backdrop-blur-md px-6 flex items-center justify-between z-40"></header>

  <!-- Main Workspace Layout with Sidebar -->
  <div id="app-container" class="flex-1 flex overflow-hidden min-h-0">
    <!-- Sidebar Navigation -->
    <aside id="app-sidebar" class="w-64 border-r border-border bg-card/40 backdrop-blur-md flex flex-col h-full select-none shrink-0 overflow-hidden"></aside>

    <!-- Main Dynamic View Container -->
    <main id="app-main" class="flex-1 overflow-y-auto p-6 bg-gradient-to-b from-background via-background/95 to-card/20 min-h-0">
      
      <!-- VIEW: Login -->
      <div id="view-login" class="view-panel">
        <div class="min-h-screen w-full flex items-center justify-center p-4 bg-gradient-to-br from-background via-card/30 to-primary-950/30 relative overflow-hidden">
          <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary-600/10 rounded-full blur-3xl pointer-events-none"></div>
          <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-accent-purple/10 rounded-full blur-3xl pointer-events-none"></div>

          <div class="w-full max-w-md glass-panel p-8 rounded-3xl border border-border/80 shadow-2xl space-y-6 relative z-10">
            <div class="text-center space-y-2">
              <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-primary-600 via-accent-purple to-accent-cyan flex items-center justify-center text-white mx-auto shadow-xl shadow-primary-500/25">
                <svg class="w-7 h-7 animate-pulse" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3z"/></svg>
              </div>
              <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                Sign In to <span class="gradient-text">OmniAgent AI</span>
              </h1>
              <p class="text-xs text-gray-400">Zero-Cost Local Multi-Agent AI Platform</p>
            </div>

            <div id="login-error"></div>

            <!-- 1-Click Guest Demo Login Button -->
            <button id="btn-demo-login" type="button" class="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-cardLight/80 hover:bg-cardLight text-gray-200 hover:text-white font-semibold text-xs border border-primary-500/30 hover:border-primary-500/60 transition-all shadow-md active:scale-[0.99]">
              <svg class="w-4 h-4 text-accent-cyan" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              <span>1-Click Guest / Demo Sign In</span>
            </button>

            <div class="relative flex items-center justify-center">
              <div class="border-t border-border w-full"></div>
              <span class="bg-card px-3 text-[10px] text-gray-400 uppercase tracking-widest absolute">Or Sign In with Email</span>
            </div>

            <form id="form-login" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5">Email or Username</label>
                <div class="relative">
                  <input type="text" id="login-email" required placeholder="user@example.com" class="w-full bg-cardLight/70 border border-border rounded-xl px-4 py-2.5 pl-10 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-primary-500" />
                  <svg class="w-4 h-4 text-gray-500 absolute left-3.5 top-3" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5">Password</label>
                <div class="relative">
                  <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-cardLight/70 border border-border rounded-xl px-4 py-2.5 pl-10 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-primary-500" />
                  <svg class="w-4 h-4 text-gray-500 absolute left-3.5 top-3" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
              </div>

              <button type="submit" class="w-full flex items-center justify-center gap-2 py-3.5 px-4 rounded-xl bg-gradient-to-r from-primary-600 via-primary-500 to-accent-purple hover:from-primary-500 hover:to-primary-600 text-white font-semibold text-xs transition-all shadow-lg shadow-primary-600/30 active:scale-[0.99]">
                <span>Sign In to Workspace</span>
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
              </button>
            </form>

            <!-- Login History Section (shown dynamically via JS) -->
            <div id="login-history-section" class="hidden">
              <div class="relative flex items-center justify-center">
                <div class="border-t border-border w-full"></div>
                <span class="bg-card px-3 text-[10px] text-gray-400 uppercase tracking-widest absolute">Recent Accounts</span>
              </div>
              <div id="login-history-list" class="space-y-2 mt-1"></div>
            </div>

            <div class="text-center text-xs text-gray-400 pt-2">
              Don't have an account? <a href="#register" class="text-primary-400 font-semibold hover:underline">Register here</a>
            </div>
          </div>
        </div>
      </div>

      <!-- VIEW: Register -->
      <div id="view-register" class="view-panel">
        <div class="min-h-screen w-full flex items-center justify-center p-4 bg-gradient-to-br from-background via-card/30 to-primary-950/30 relative overflow-hidden">
          <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary-600/10 rounded-full blur-3xl pointer-events-none"></div>
          <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-accent-purple/10 rounded-full blur-3xl pointer-events-none"></div>

          <div class="w-full max-w-md glass-panel p-8 rounded-3xl border border-border/80 shadow-2xl space-y-6 relative z-10">
            <div class="text-center space-y-2">
              <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-primary-600 via-accent-purple to-accent-cyan flex items-center justify-center text-white mx-auto shadow-lg shadow-primary-500/20">
                <svg class="w-6 h-6 animate-pulse" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3z"/></svg>
              </div>
              <h1 class="text-2xl font-bold text-white tracking-tight">Create Account</h1>
              <p class="text-xs text-gray-400">Join the OmniAgent AI Multi-Agent Platform</p>
            </div>

            <div id="register-status"></div>

            <form id="form-register" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5">Email Address</label>
                <div class="relative">
                  <input type="email" id="reg-email" required placeholder="user@example.com" class="w-full bg-cardLight/70 border border-border rounded-xl px-4 py-2.5 pl-10 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-primary-500" />
                  <svg class="w-4 h-4 text-gray-500 absolute left-3.5 top-3" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5">Username</label>
                <div class="relative">
                  <input type="text" id="reg-username" required placeholder="johndoe" class="w-full bg-cardLight/70 border border-border rounded-xl px-4 py-2.5 pl-10 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-primary-500" />
                  <svg class="w-4 h-4 text-gray-500 absolute left-3.5 top-3" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1.5">Password</label>
                <div class="relative">
                  <input type="password" id="reg-password" required placeholder="••••••••" class="w-full bg-cardLight/70 border border-border rounded-xl px-4 py-2.5 pl-10 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-primary-500" />
                  <svg class="w-4 h-4 text-gray-500 absolute left-3.5 top-3" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
              </div>

              <button type="submit" class="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-gradient-to-r from-primary-600 to-accent-purple hover:from-primary-500 hover:to-primary-600 text-white font-semibold text-xs transition-all shadow-lg shadow-primary-600/30">
                <span>Create Account</span>
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
              </button>
            </form>

            <div class="text-center text-xs text-gray-400">
              Already have an account? <a href="#login" class="text-primary-400 font-semibold hover:underline">Sign in here</a>
            </div>
          </div>
        </div>
      </div>

      <!-- VIEW: Dashboard -->
      <div id="view-dashboard" class="view-panel active"></div>

      <!-- VIEW: Multi-Agent Chat -->
      <div id="view-chat" class="view-panel"></div>

      <!-- VIEW: Document Hub & RAG -->
      <div id="view-documents" class="view-panel"></div>

      <!-- VIEW: Agent Orchestrator -->
      <div id="view-agents" class="view-panel"></div>

      <!-- VIEW: Settings -->
      <div id="view-settings" class="view-panel"></div>

    </main>
  </div>

  <!-- User Profile Modal Dialog Overlay -->
  <div id="profile-modal" class="hidden"></div>

  <!-- Standard JavaScript Files -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>


</body>
</html>
